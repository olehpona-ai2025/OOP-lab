services:
  web:
    image: funfarm
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/admin"
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: "org.postgresql.Driver"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "admin"
    depends_on:
      - db
  db:
    image: postgres
    environment:
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"